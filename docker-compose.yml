version: '3.8'

services:
  # Application Web Server (Flask + Gunicorn)
  web:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://kaamsaathi_user:kaamsaathi_secure_pwd_2026@postgres:5432/kaamsaathi_prod
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=kaamsaathi_master_prod_secret_key_2026_production_deployment
      - ADMIN_EMAIL=admin@kaamsaathi.com
      - ADMIN_INITIAL_PASSWORD=KaamSaathiAdmin@2026
      - PAYMENT_WEBHOOK_SECRET=live_webhook_secret_placeholder
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,https://kaamsaathi.com,https://admin.kaamsaathi.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Production PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: kaamsaathi_prod
      POSTGRES_USER: kaamsaathi_user
      POSTGRES_PASSWORD: kaamsaathi_secure_pwd_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaamsaathi_user -d kaamsaathi_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # In-Memory Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
